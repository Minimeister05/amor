<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pra você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0510;
    overflow: hidden;
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }
  #foto {
    position: fixed; inset: -2%; z-index: 0;
    background: center / cover no-repeat;
  }
  #foto.sem-foto {
    background-image: radial-gradient(120% 90% at 50% 20%, #2d1136 0%, #12061c 55%, #070310 100%);
  }
  #veu {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(75% 60% at 50% 45%, rgba(10,4,18,.12), rgba(7,3,14,.82));
    opacity: .5;
    transition: opacity 1.6s ease;
  }
  body.rolando #veu { opacity: .8; }
  #ceu { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  main {
    position: fixed; inset: 0; z-index: 3;
    display: grid; place-items: center;
    padding: 6vw;
    pointer-events: none;
  }
  #botao {
    pointer-events: auto;
    font: inherit;
    font-size: clamp(1.1rem, 3.6vw, 1.4rem);
    letter-spacing: .08em;
    color: #fff4ee;
    padding: .8em 2.2em;
    border-radius: 999px;
    border: 1px solid rgba(255,196,214,.5);
    background: rgba(255,110,155,.18);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    box-shadow: 0 0 34px rgba(255,95,141,.3), inset 0 0 22px rgba(255,180,205,.18);
    cursor: pointer;
    animation: batida 2.6s ease-in-out infinite;
    transition: background .4s ease, opacity .9s ease, transform .9s ease;
  }
  #botao:hover { background: rgba(255,110,155,.3); }
  #botao:focus-visible { outline: 2px solid #ffd479; outline-offset: 5px; }
  #botao.sumiu { opacity: 0; transform: scale(.92); pointer-events: none; animation: none; }
  @keyframes batida {
    0%, 60%, 100% { transform: scale(1); }
    12% { transform: scale(1.055); }
    26% { transform: scale(1); }
    36% { transform: scale(1.03); }
  }
  #recado {
    position: fixed; z-index: 4;
    left: 6vw; right: 6vw; bottom: 14vh;
    margin: 0;
    text-align: center;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.5rem, 5.8vw, 2.9rem);
    line-height: 1.25;
    color: #fff4ee;
    text-shadow: 0 0 28px rgba(255,120,160,.55), 0 2px 18px rgba(0,0,0,.65);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.8s ease, transform 1.8s ease;
  }
  #recado.aparece { opacity: 1; transform: none; }
  #denovo {
    position: fixed; z-index: 5;
    left: 50%; bottom: 5vh; transform: translateX(-50%);
    font: inherit; font-size: 1rem; letter-spacing: .12em;
    color: rgba(255,244,238,.72);
    background: none; border: 0;
    border-bottom: 1px solid rgba(255,244,238,.3);
    padding: .2em .1em;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease, color .3s ease;
  }
  #denovo.aparece { opacity: 1; pointer-events: auto; }
  #denovo:hover { color: #fff; }
  #denovo:focus-visible { outline: 2px solid #ffd479; outline-offset: 5px; }
  @media (prefers-reduced-motion: reduce) {
    #botao { animation: none; }
  }
</style>
</head>
<body>
<div id="foto"></div>
<div id="veu"></div>
<canvas id="ceu"></canvas>
<main><button id="botao">me aperte</button></main>
<p id="recado"></p>
<button id="denovo">de novo</button>
<script>
const IMAGEM_DE_FUNDO = "fundo.jpg";
const TEXTO = "só pra lembrar que eu te amo muito!";
const SOM = true;

const foto = document.getElementById('foto');
const botao = document.getElementById('botao');
const recado = document.getElementById('recado');
const denovo = document.getElementById('denovo');
const canvas = document.getElementById('ceu');
const ctx = canvas.getContext('2d');

recado.textContent = TEXTO;

const teste = new Image();
teste.onload = () => { foto.style.backgroundImage = 'url("' + IMAGEM_DE_FUNDO + '")'; };
teste.onerror = () => foto.classList.add('sem-foto');
teste.src = IMAGEM_DE_FUNDO;

const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;

let L = 0, A = 0;
function ajustar() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  L = window.innerWidth;
  A = window.innerHeight;
  canvas.width = Math.round(L * dpr);
  canvas.height = Math.round(A * dpr);
  canvas.style.width = L + 'px';
  canvas.style.height = A + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
ajustar();
addEventListener('resize', ajustar);

const CORES = [[255,95,141],[255,179,201],[255,212,121],[255,243,234],[210,155,255]];
const TONS_CORACAO = [0,1,3];

const sprites = CORES.map(c => {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const g = s.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',1)');
  grad.addColorStop(.35, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',.5)');
  grad.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return s;
});

let audio = null;
function pop(vol) {
  if (!SOM) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const dur = .55, sr = audio.sampleRate;
    const buf = audio.createBuffer(1, Math.floor(sr * dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / d.length;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 5);
    }
    const src = audio.createBufferSource();
    src.buffer = buf;
    const f = audio.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 700 + Math.random() * 900;
    const g = audio.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(audio.destination);
    src.start();
  } catch (e) {}
}

let fagulhas = [], foguetes = [], coracao = [];
let cx = 0, cy = 0, caindo = false, formado = false;

function fagulha(x, y, vx, vy, g, vida, decai, tam, sp) {
  fagulhas.push({ x, y, vx, vy, g, vida, decai, tam, sp });
}

function lancar(x, alvoY, sp) {
  foguetes.push({ x, y: A + 8, vx: (Math.random() - .5) * 50, vy: -((A - alvoY) + 130), alvoY, sp });
}

function estourar(x, y, sp) {
  const n = 70 + Math.floor(Math.random() * 45);
  const base = 110 + Math.random() * 130;
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const v = base * (.3 + Math.random() * .8);
    fagulha(x, y, Math.cos(ang) * v, Math.sin(ang) * v, 300, 1, .5 + Math.random() * .55, 1.9 + Math.random() * 2.1, sp);
  }
  pop(.09);
}

function montarCoracao() {
  cx = L / 2;
  cy = A * .42;
  const escala = Math.min(L, A) * .019;
  const total = L < 620 ? 430 : 740;
  const contorno = Math.floor(total * .5);
  coracao = [];
  for (let i = 0; i < total; i++) {
    let t, r;
    if (i < contorno) { t = (i / contorno) * Math.PI * 2; r = 1; }
    else { t = Math.random() * Math.PI * 2; r = Math.pow(Math.random(), .45); }
    const px = 16 * Math.pow(Math.sin(t), 3);
    const py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    coracao.push({
      x: cx, y: cy,
      ax: cx + px * r * escala,
      ay: cy + py * r * escala,
      atraso: Math.random() * (calmo ? .05 : .28),
      dur: .7 + Math.random() * .5,
      t: 0,
      fase: 'indo',
      fx: Math.random() * 6.28,
      fy: Math.random() * 6.28,
      vx: 0, vy: 0,
      vida: 1,
      tam: 2 + Math.random() * 2.2,
      sp: TONS_CORACAO[(Math.random() * 3) | 0]
    });
  }
}

function atualizarFoguetes(dt) {
  for (let i = foguetes.length - 1; i >= 0; i--) {
    const f = foguetes[i];
    f.vy += 270 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    fagulha(f.x + (Math.random() - .5) * 3, f.y, 0, 25, 0, .65, 3, 1.4, f.sp);
    if (f.y <= f.alvoY || f.vy >= 0) {
      estourar(f.x, f.y, f.sp);
      foguetes.splice(i, 1);
    }
  }
}

function atualizarFagulhas(dt) {
  const a = Math.pow(.9, dt * 60);
  for (let i = fagulhas.length - 1; i >= 0; i--) {
    const p = fagulhas[i];
    p.vx *= a;
    p.vy = p.vy * a + p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= p.decai * dt;
    if (p.vida <= 0) fagulhas.splice(i, 1);
  }
}

function atualizarCoracao(dt) {
  let prontos = 0;
  for (const p of coracao) {
    if (p.fase === 'indo') {
      p.t += dt;
      const k = Math.max(0, Math.min(1, (p.t - p.atraso) / p.dur));
      const e = 1 - Math.pow(1 - k, 3);
      p.x = cx + (p.ax - cx) * e;
      p.y = cy + (p.ay - cy) * e;
      if (k >= 1) p.fase = 'parado';
    } else if (p.fase === 'parado') {
      prontos++;
      p.fx += dt * 1.5;
      p.fy += dt * 1.3;
      p.x = p.ax + Math.sin(p.fx) * 2.2;
      p.y = p.ay + Math.cos(p.fy) * 2.2;
    } else {
      const a = Math.pow(.95, dt * 60);
      p.vx *= a;
      p.vy = p.vy * a + 80 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vida -= dt * .45;
    }
  }
  formado = prontos > coracao.length * .8;
  if (caindo) coracao = coracao.filter(p => p.vida > 0);
}

function brilhos(dt) {
  if (calmo || caindo || !formado || !coracao.length) return;
  if (Math.random() < dt * 16) {
    const p = coracao[(Math.random() * coracao.length) | 0];
    fagulha(p.x, p.y, (Math.random() - .5) * 16, -14 - Math.random() * 20, -10, 1, .45, 1.2 + Math.random(), 2);
  }
}

let pulso = 1;
function desenhar() {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,.19)';
  ctx.fillRect(0, 0, L, A);
  ctx.globalCompositeOperation = 'lighter';
  for (const p of fagulhas) por(p, p.vida);
  for (const p of coracao) por(p, p.vida * pulso);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function por(p, a) {
  if (a <= 0) return;
  ctx.globalAlpha = Math.min(1, a);
  const s = p.tam * 6;
  ctx.drawImage(sprites[p.sp], p.x - s / 2, p.y - s / 2, s, s);
}

let ultimo = 0, tempo = 0;
function laco(ts) {
  const dt = ultimo ? Math.min(.05, (ts - ultimo) / 1000) : 0;
  ultimo = ts;
  tempo += dt;
  pulso = .8 + .2 * Math.sin(tempo * 2.6);
  atualizarFoguetes(dt);
  atualizarFagulhas(dt);
  atualizarCoracao(dt);
  brilhos(dt);
  desenhar();
  requestAnimationFrame(laco);
}
requestAnimationFrame(laco);

const relogios = [];
function agenda(f, ms) { relogios.push(setTimeout(f, ms)); }

function iniciarCoracao() {
  montarCoracao();
  caindo = false;
  formado = false;
  pop(.16);
  if (!calmo) {
    for (let i = 0; i < 70; i++) {
      const ang = Math.random() * 6.283;
      const v = 50 + Math.random() * 170;
      fagulha(cx, cy, Math.cos(ang) * v, Math.sin(ang) * v, 260, 1, 1.1, 1.5 + Math.random() * 1.6, 3);
    }
  }
  agenda(() => recado.classList.add('aparece'), 1100);
  agenda(() => {
    caindo = true;
    for (const p of coracao) {
      p.fase = 'caindo';
      const ang = Math.random() * 6.283;
      p.vx = Math.cos(ang) * 24;
      p.vy = Math.sin(ang) * 24 - 12;
    }
  }, 7200);
  agenda(() => denovo.classList.add('aparece'), 8600);
}

function show() {
  relogios.forEach(clearTimeout);
  relogios.length = 0;
  document.body.classList.add('rolando');
  botao.classList.add('sumiu');
  denovo.classList.remove('aparece');
  recado.classList.remove('aparece');
  fagulhas = [];
  foguetes = [];
  coracao = [];
  if (calmo) { agenda(iniciarCoracao, 200); return; }
  let d = 300;
  for (let i = 0; i < 5; i++) {
    agenda(() => lancar(L * (.18 + Math.random() * .64), A * (.14 + Math.random() * .28), (Math.random() * CORES.length) | 0), d);
    d += 250 + Math.random() * 240;
  }
  agenda(iniciarCoracao, d + 400);
}

botao.addEventListener('click', show);
denovo.addEventListener('click', show);
</script>
</body>
</html>
